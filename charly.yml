charly-pod:
    candy:
        description: |-
            Concept candy owning the charly-pod kind-authoring skills (pod/deploy schema). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the pod concept candy's skill entities are present and generated into the marketplace's pod/skills
              id: charly-pod-present
              context:
                - build
              command: "true"
pod-skill:
    skill:
        name: pod
        family: pod
        owner: charly-pod
        description: |-
            Schema reference for `kind: pod` and deploy entities: charly.yml entry shape, tree-position nesting, sidecars, and pod networking. Use the deploy skill for verb-level operations.

